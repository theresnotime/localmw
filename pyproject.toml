[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localmw"
dynamic = ["version"]
description = "Manage local MediaWiki development installs: pull, report, and tidy up review branches."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sammy Fox", email = "sam@theresnotime.co.uk" }]
keywords = ["mediawiki", "gerrit", "git", "wikimedia", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "click>=8.1",
    "rich>=15.0.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/theresnotime/localmw"
Issues = "https://github.com/theresnotime/localmw/issues"

[project.scripts]
localmw = "localmw.cli:main"

[tool.hatch.version]
path = "src/localmw/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/localmw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
